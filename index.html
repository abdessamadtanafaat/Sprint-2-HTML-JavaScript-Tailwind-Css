<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Blog Templat </title>

    <!-- Chargement de Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script defer src="/js/tailwindConfig.js"> </script>

    <!-- Chargement du JavaScript -->
    <script defer src="/js/darkMode.js"> </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-white">
<div class="container mx-auto text-center p-10">
    <h1 class="text-3xl font-bold">Bienvenue sur notre blog</h1>

    <!-- Bouton avec l'icône pour basculer entre les modes -->
    <button id="darkModeToggle" class="mt-5 p-2 rounded-full bg-gray-200 dark:bg-gray-700">
        <!-- Icône Lune (Mode Sombre) -->
        <svg id="moonIcon" class="w-8 h-8 dark:hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
            <path d="M9.37 2.16a9 9 0 1 0 12.47 12.47A9.38 9.38 0 1 1 9.37 2.16z"/>
        </svg>

        <!-- Icône Soleil (Mode Clair) -->
        <svg id="sunIcon" class="w-8 h-8 hidden dark:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
            <path d="M12 4a1 1 0 1 1-2 0V2a1 1 0 1 1 2 0v2zm5.66 2.34a1 1 0 1 1-1.41-1.41l1.41-1.42a1 1 0 1 1 1.42 1.42l-1.42 1.41zM18 12a1 1 0 1 1 0-2h2a1 1 0 1 1 0 2h-2zm-6 6a1 1 0 1 1-2 0v-2a1 1 0 1 1 2 0v2zm-5.66-1.66a1 1 0 1 1-1.42-1.42l1.42-1.41a1 1 0 1 1 1.41 1.42l-1.41 1.41zM6 12a1 1 0 1 1 0-2H4a1 1 0 1 1 0 2h2zm6-8a8 8 0 1 0 8 8 8.009 8.009 0 0 0-8-8z"/>
        </svg>
    </button>

</div>
</body>
</html>
