        <!-- Contact Form -->
        <div>
            <form action="#" method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="name" class="block text-gray-700">Name</label>
                        <input type="text" id="name" name="name" class="w-full px-4 py-2 border text-gray-800"/>
                    </div>
                    <div class="space-y-2">
                        <label for="email" class="block text-gray-700">Email</label>
                        <input type="email" id="email" name="email" class="w-full px-4 py-2 border text-gray-800"/>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="subject" class="block text-gray-700">Subject</label>
                    <input type="text" id="subject" name="subject" class="w-full px-4 py-2 border text-gray-800"/>
                </div>

                <div class="space-y-2">
                    <label for="message" class="block text-gray-700">Message</label>
                    <textarea id="message" name="message" rows="4" class="w-full px-4 py-2 border text-gray-800"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-red-600 text-white">Send Message</button>
            </form>
        </div>
    </div>
</section>
