<header class="bg-gray-200 dark:bg-gray-800 shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center relative">
        <!-- Menu Section -->
        <div class="flex items-center">
            <!-- Mobile Menu Button (left side) -->
            <button id="mobileMenuButton" class="md:hidden text-gray-700 dark:text-white focus:outline-none" aria-label="Open mobile menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Logo and Title -->
        <div class="flex flex-col justify-start md:mx-0 md:text-left md:w-auto w-full text-center">
            <p class="text-2xl text-red-600">IS : simply dummy text of to</p>
            <p class="text-gray-500 dark:text-gray-200">Lorem is simply dummy text of the printing and typesetting</p>
        </div>

        <!-- Navigation, Search, and Mobile Menu -->
        <div class="flex items-center space-x-6 md:space-x-4"> <!-- Flex container for nav, search, and menu -->
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-6">
                <a href="#" class="relative text-black text-gray-500 dark:text-gray-400">USERS</a>
                <a href="#" class="relative text-black text-gray-500 dark:text-gray-400">Lorem US</a>
                <a href="#" class="relative text-black text-gray-500 dark:text-gray-400">PRINTING US</a>
            </nav>

            <!-- For Laptop Devices (search input and button next to the navigation) -->
            <div class="flex items-center space-x-4">
            <div class="relative hidden md:block">
                <input type="text" id="searchInput" placeholder="Search..." class="w-48 px-4 py-2 border rounded-full dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
                <button class="absolute right-3 top-2 text-gray-500">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"/>
                    </svg>
                </button>
            </div>
                <!-- Language Toggle Button inside a Circle -->
                <button id="languageToggle" class="relative p-2 rounded-full bg-gray-200 dark:bg-gray-800 z-100 cursor-pointer" aria-label="Toggle Language">
                    <span id="languageText" class="text-gray-700 dark:text-white">EN</span>
                    <div class="absolute inset-0 rounded-full border-2 border-gray-400 dark:border-gray-600 hover:border-red-600"></div>
                </button>


            </div>
            <!-- Mobile Devices (search button on the left) -->
            <div class="relative md:hidden">
                <button id="searchButton" class="text-gray-700 dark:text-white focus:outline-none" aria-label="Search">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"/>
                    </svg>
                </button>

                <!-- Mobile Search Input (Initially Hidden) -->
                <div id="searchContainer" class="fixed inset-0 bg-white dark:bg-gray-800 hidden flex items-center justify-center z-50 md:hidden">
                    <button id="closeSearch" class="absolute top-4 left-4 text-gray-700 dark:text-gray-200">
                        ✕
                    </button>
                    <input type="text" id="searchInputMobile" placeholder="Search..."
                           class="w-full p-4 text-2xl border-b-2 focus:outline-none focus:border-red-600 bg-transparent text-center text-black dark:text-white">
                </div>
            </div>

        </div>
    </div>
    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-gray-800 fixed inset-0 z-50 flex flex-col">
        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="en">USERS</a>
        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="ar" style="display: none;">المستخدمين</a>

        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="en">Lorem US</a>
        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="ar" style="display: none;">لوريم يو إس</a>

        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="en">Nous connaître</a>
        <a href="#" class="lang block py-2 px-4 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-lang="ar" style="display: none;">نعرفنا</a>

        <!-- Close button -->
        <button id="closeMobileMenu" class="absolute top-4 right-4 text-gray-700 dark:text-gray-200">
            ✕
        </button>
    </div>
</header>
